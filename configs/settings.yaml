image:
  model_id: "stabilityai/stable-diffusion-xl-base-1.0"
  device: "cuda"              # "cpu" if no GPU
  use_fp16: true
  steps: 25
  guidance_scale: 7.0

text:
  chunk_size: 1200
  overlap: 120
  summary_sentences: 6

voice:
  # You must download a piper voice model (.onnx)
  # Example path (change this):
  piper_model_path: "assets/voices/en_US-lessac-medium.onnx"

video:
  fps: 24
  seconds_per_scene: 2.5
  max_scenes: 5
